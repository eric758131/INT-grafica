<div class="bg-white rounded-lg shadow-xl p-8">
  <div class="flex justify-between items-center mb-6">
    <h3 class="text-2xl font-bold text-gray-800">Lista de Usuarios</h3>
    <button (click)="abrirModal()"
      class="px-4 py-2 bg-gradient-to-r from-green-500 to-teal-500 text-white rounded-lg hover:scale-105 transition">
      ➕ Nuevo Usuario
    </button>
  </div>

  <!-- Tabla de usuarios -->
  <div class="overflow-x-auto">
    <table class="min-w-full bg-white">
      <thead class="bg-gradient-to-r from-gray-100 to-gray-200">
        <tr><th class="p-3">CI</th><th>Nombre</th><th>Email</th><th>Estado</th><th>Acciones</th></tr>
      </thead>
      <tbody>
        @for (u of usuarios; track u.id) {
          <tr class="hover:bg-gray-50">
            <td class="p-3">{{u.ci}}</td>
            <td>{{u.nombre}} {{u.apellido_paterno}}</td>
            <td>{{u.email}}</td>
            <td><span class="px-2 py-1 rounded-full text-xs" [class.bg-green-100]="u.estado==='activo'" [class.bg-red-100]="u.estado!=='activo'">{{u.estado}}</span></td>
            <td>
              <button (click)="abrirModalEditar(u)" class="text-blue-600 mr-2">✏️</button>
              <button (click)="eliminarUsuario(u.id!)" class="text-red-600">🗑️</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

@if (mostrarModal) {
  <app-modal-usuario [usuarioEditar]="usuarioSeleccionado" (cerrarModal)="cerrarModal()" (usuarioGuardado)="recargar()"></app-modal-usuario>
}
