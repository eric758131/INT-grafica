<div class="bg-white rounded-lg shadow-xl p-8 max-w-3xl mx-auto">
  <h3 class="text-2xl font-bold text-gray-800 mb-6">Crear Nuevo Usuario</h3>
  
  <!-- Mensajes de éxito/error -->
  @if (successMessage) {
    <div class="mb-4 bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
      {{ successMessage }}
    </div>
  }
  
  @if (errorMessage) {
    <div class="mb-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
      {{ errorMessage }}
    </div>
  }

  <form #usuarioForm="ngForm" (ngSubmit)="guardarUsuario()" class="space-y-6">
    <!-- Fila 1: Nombres -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Nombre *
        </label>
        <input
          [(ngModel)]="usuario.nombre"
          name="nombre"
          required
          #nombre="ngModel"
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
          placeholder="Juan"
        >
        @if (nombre.invalid && nombre.touched) {
          <p class="text-red-500 text-xs mt-1">Campo requerido</p>
        }
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Apellido Paterno *
        </label>
        <input
          [(ngModel)]="usuario.apellido_paterno"
          name="apellido_paterno"
          required
          #apPaterno="ngModel"
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
          placeholder="Pérez"
        >
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Apellido Materno
        </label>
        <input
          [(ngModel)]="usuario.apellido_materno"
          name="apellido_materno"
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
          placeholder="González"
        >
      </div>
    </div>

    <!-- Fila 2: CI y Email -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          CI / Cédula *
        </label>
        <input
          [(ngModel)]="usuario.ci"
          name="ci"
          required
          #ci="ngModel"
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
          placeholder="12345678"
        >
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Email *
        </label>
        <input
          [(ngModel)]="usuario.email"
          name="email"
          required
          email
          #email="ngModel"
          type="email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
          placeholder="usuario@email.com"
        >
      </div>
    </div>

    <!-- Fila 3: Fecha Nacimiento y Género -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Fecha de Nacimiento
        </label>
        <input
          [(ngModel)]="usuario.fecha_nacimiento"
          name="fecha_nacimiento"
          type="date"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
        >
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Género
        </label>
        <select
          [(ngModel)]="usuario.genero"
          name="genero"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
        >
          <option value="">Seleccionar</option>
          <option value="masculino">Masculino</option>
          <option value="femenino">Femenino</option>
          <option value="otro">Otro</option>
        </select>
      </div>
    </div>

    <!-- Fila 4: Teléfono y Dirección -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Teléfono
        </label>
        <input
          [(ngModel)]="usuario.telefono"
          name="telefono"
          type="tel"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
          placeholder="+591 12345678"
        >
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Dirección
        </label>
        <input
          [(ngModel)]="usuario.direccion"
          name="direccion"
          type="text"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
          placeholder="Calle, #123"
        >
      </div>
    </div>

    <!-- Fila 5: Contraseña -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Contraseña *
        </label>
        <input
          [(ngModel)]="usuario.password"
          name="password"
          required
          #password="ngModel"
          type="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
          placeholder="********"
        >
      </div>
      <div>
        <label class="block text-gray-700 text-sm font-bold mb-2">
          Confirmar Contraseña *
        </label>
        <input
          [(ngModel)]="usuario.password2"
          name="password2"
          required
          type="password"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200 transition-all"
          placeholder="********"
        >
      </div>
    </div>

    <!-- Estado del usuario -->
    <div>
      <label class="block text-gray-700 text-sm font-bold mb-2">
        Estado
      </label>
      <div class="flex items-center space-x-4">
        <label class="flex items-center">
          <input
            [(ngModel)]="usuario.estado"
            name="estado"
            type="radio"
            value="activo"
            class="mr-2"
            checked
          >
          <span>Activo</span>
        </label>
        <label class="flex items-center">
          <input
            [(ngModel)]="usuario.estado"
            name="estado"
            type="radio"
            value="inactivo"
            class="mr-2"
          >
          <span>Inactivo</span>
        </label>
      </div>
    </div>

    <!-- Botones -->
    <div class="flex justify-end space-x-4 pt-4 border-t border-gray-200">
      <button
        type="button"
        (click)="cancelar()"
        class="px-6 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="loading || usuarioForm.invalid"
        class="px-6 py-2 bg-gradient-to-r from-blue-500 to-purple-600 text-white rounded-lg hover:from-blue-600 hover:to-purple-700 transition-all transform hover:scale-105 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ loading ? 'Guardando...' : 'Guardar Usuario' }}
      </button>
    </div>
  </form>
</div>
