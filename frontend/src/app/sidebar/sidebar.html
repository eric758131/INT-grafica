<aside class="fixed top-0 left-0 h-screen w-64 bg-gradient-to-br from-indigo-600 via-purple-700 to-purple-900 text-white flex flex-col shadow-2xl z-50">
  
  <div class="p-6 border-b border-white/20">
    <h1 class="text-2xl font-bold text-center">Sistema Gestión</h1>
    <p class="text-xs text-center text-white/80 mt-1">v1.0.0</p>
  </div>

  <nav class="flex-1 overflow-y-auto py-6">
    <ul class="space-y-2 px-3">
      <li>
        <a (click)="navigateTo('usuarios')" 
           class="flex items-center px-4 py-3 cursor-pointer transition-all duration-300 rounded-xl font-semibold"
           [class.bg-white/25]="activeMenu === 'usuarios'">
          <span class="material-icons mr-3 text-2xl">people</span>
          <span>Usuarios</span>
        </a>
      </li>

      <li>
        <a (click)="navigateTo('pacientes')" 
           class="flex items-center px-4 py-3 cursor-pointer transition-all duration-300 rounded-xl font-semibold"
           [class.bg-white/25]="activeMenu === 'pacientes'">
          <span class="material-icons mr-3 text-2xl">health_and_safety</span>
          <span>Pacientes</span>
        </a>
      </li>

      <li>
        <a (click)="navigateTo('camas')" 
           class="flex items-center px-4 py-3 cursor-pointer transition-all duration-300 rounded-xl font-semibold"
           [class.bg-white/25]="activeMenu === 'camas'">
          <span class="material-icons mr-3 text-2xl">hotel</span>
          <span>Camas</span>
        </a>
      </li>

      <li>
        <a (click)="navigateTo('evaluacion')" 
           class="flex items-center px-4 py-3 cursor-pointer transition-all duration-300 rounded-xl font-semibold"
           [class.bg-white/25]="activeMenu === 'evaluacion'">
          <span class="material-icons mr-3 text-2xl">science</span>
          <span>Evaluaciones</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="p-4 border-t border-white/20">
    <button (click)="logout()" 
       class="w-full flex items-center justify-center px-4 py-3 rounded-xl cursor-pointer transition-all duration-300 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 shadow-lg">
      <span class="material-icons mr-2 text-xl">logout</span>
      <span class="font-bold">Cerrar Sesión</span>
    </button>
  </div>
</aside>
