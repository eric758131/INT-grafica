@if (visible) {
  <div class="modal-backdrop" (click)="cerrar()">
    <div class="modal-container" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h2 class="modal-title">📊 Estadísticas de Camas en 3D</h2>
          <p class="modal-subtitle">Visualización interactiva de camas por estado</p>
        </div>
        <button class="btn-close" (click)="cerrar()">✕</button>
      </div>
      <div class="modal-body">
        <div #canvasContainer class="canvas-container"></div>
        <div class="leyenda">
          <div class="leyenda-item">
            <div class="color-box" style="background: #3b82f6;"></div>
            <span>Disponible</span>
          </div>
          <div class="leyenda-item">
            <div class="color-box" style="background: #8b5cf6;"></div>
            <span>Ocupada</span>
          </div>
          <div class="leyenda-item">
            <div class="color-box" style="background: #06b6d4;"></div>
            <span>Reservada</span>
          </div>
          <div class="leyenda-item">
            <div class="color-box" style="background: #f59e0b;"></div>
            <span>Mantenimiento</span>
          </div>
        </div>
      </div>
    </div>
  </div>
}
